# TRAKTOR — nginx (alternatywa dla Caddy). TLS z certbotem (Let's Encrypt).
#
# Instalacja:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/traktor
#   sudo ln -s /etc/nginx/sites-available/traktor /etc/nginx/sites-enabled/traktor
#   sudo nano /etc/nginx/sites-available/traktor      # podmień traktor.example.pl
#   sudo nginx -t
#   sudo certbot --nginx -d traktor.example.pl        # certbot sam dopisze listen 443 i ścieżki certyfikatów
#   sudo systemctl reload nginx
#
# Kolejność: najpierw blok :80 (bez TLS) → certbot → potem ten blok :443.
# Jeśli uruchamiasz plik od razu z blokiem :443, certbot --nginx i tak podmieni ścieżki,
# ale przed pierwszym uruchomieniem nie ma /etc/letsencrypt/live/traktor.example.pl/fullchain.pem.
#
# Aplikacja słucha na 127.0.0.1:3000 (deploy/traktor.service). Port 3000 nie może być widoczny z zewnątrz.

upstream traktor_app {
	server 127.0.0.1:3000;
	keepalive 32;
}

# --- HTTP → HTTPS ------------------------------------------------------------
server {
	listen 80;
	listen [::]:80;
	server_name traktor.example.pl;

	# Pozwól certbotowi na walidację HTTP-01.
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# --- HTTPS -------------------------------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name traktor.example.pl;

	# Certbot uzupełnia te dwie linie (albo zarządza nimi sam przez --nginx).
	ssl_certificate     /etc/letsencrypt/live/traktor.example.pl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/traktor.example.pl/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	# CSP, X-Frame-Options, Referrer-Policy i Permissions-Policy ustawia web/next.config.ts.
	# Tutaj tylko HSTS (aplikacja nie wie, że działa za TLS).
	#
	# Uwaga na nginx: dyrektywa add_header w location zastępuje wszystkie add_header
	# z bloku server. Dlatego HSTS powtarzamy w każdym location, który ma własne add_header.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	# Treść POST /api/analiza ma limit 4 kB w kodzie. 16 kB zapasu wystarcza,
	# a odcina próby wysłania dużych ciał.
	client_max_body_size 16k;
	client_body_buffer_size 16k;

	# Analiza działki trwa 5–30 s (maxDuration = 30 w kodzie). Domyślne 60 s bywa za mało
	# przy wolnym źródle zewnętrznym; 90 s daje zapas i nie trzyma zawieszonych połączeń.
	proxy_connect_timeout 10s;
	proxy_send_timeout 90s;
	proxy_read_timeout 90s;
	proxy_buffering off;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;

	server_tokens off;

	# --- kompresja ---
	# Next.js sam kompresuje odpowiedzi (domyślne compression: true), więc gzip w nginx
	# dotyczy głównie treści, których Next nie skompresował. Nie zaszkodzi, ale nie licz na duży zysk.
	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

	# Brotli tylko jeśli moduł jest zainstalowany (libnginx-mod-brotli / nginx z modułem):
	#   sudo apt install libnginx-mod-brotli
	# Wtedy odkomentuj:
	# brotli on;
	# brotli_comp_level 5;
	# brotli_types text/plain text/css application/javascript application/json image/svg+xml;

	# --- cache ---
	# Zasoby /_next/static/ mają hash treści w nazwie pliku. Next ustawia dla nich
	# Cache-Control: public, max-age=31536000, immutable — powtarzamy jawnie i chowamy
	# nagłówek z upstreamu, żeby nie było dwóch sprzecznych wartości.
	location /_next/static/ {
		proxy_pass http://traktor_app;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		access_log off;
	}

	# Obrazy i dane przykładu /mapa (public/maps) zmieniają się tylko przy wdrożeniu.
	location /maps/ {
		proxy_pass http://traktor_app;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "public, max-age=604800" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	}

	# API liczy na żywo i ma własny cache w pamięci procesu (1 h). Przeglądarka nie cache'uje.
	location /api/ {
		proxy_pass http://traktor_app;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "no-store" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		proxy_read_timeout 90s;
	}

	# Strony i pozostałe zasoby.
	location / {
		proxy_pass http://traktor_app;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
	}

	# Health check dla monitoringu (bez cache).
	location = /api/health {
		proxy_pass http://traktor_app;
		proxy_set_header Host $host;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "no-store" always;
		access_log off;
	}

	# Dziennik: /var/log/nginx/traktor.{access,error}.log
	access_log /var/log/nginx/traktor.access.log;
	error_log  /var/log/nginx/traktor.error.log warn;
}
