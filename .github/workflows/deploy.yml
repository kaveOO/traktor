name: Deploy

# Wdrożenie na Cloudflare Workers (OpenNext), patrz docs/DEPLOY-CLOUDFLARE.md.
# Uruchamia się po zielonym CI na `main` albo ręcznie (workflow_dispatch).
#
# Wymagane w repo (Settings → Secrets and variables → Actions):
#   secrets.CLOUDFLARE_API_TOKEN   token z uprawnieniem "Edit Cloudflare Workers"
#   secrets.CLOUDFLARE_ACCOUNT_ID  ID konta Cloudflare
# Opcjonalnie:
#   vars.DEPLOY_URL                np. https://traktor.<subdomena>.workers.dev (test dymny po wdrożeniu)
#   secrets.ANTHROPIC_API_KEY, secrets.GOOGLE_MAPS_API_KEY  wgrywane jako sekrety workera, jeśli są ustawione
# Bez sekretów Cloudflare job kończy się ostrzeżeniem, nie błędem.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  deploy:
    name: Cloudflare Workers
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sekrety Cloudflare
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Brak CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID - pomijam wdrożenie."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - name: Checkout (commit, który przeszedł CI)
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Node 22 + cache npm
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalacja (npm ci)
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Build OpenNext
        if: steps.guard.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build

      - name: Wdrożenie
        if: steps.guard.outputs.ready == 'true'
        run: npx opennextjs-cloudflare deploy

      - name: Sekrety workera (opcjonalne)
        if: steps.guard.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          for name in ANTHROPIC_API_KEY GOOGLE_MAPS_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          done

      - name: Test dymny wdrożenia
        if: steps.guard.outputs.ready == 'true' && vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          fail=0
          for path in / /analiza "/raport?demo=1" /mapa /api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "${DEPLOY_URL%/}${path}" || echo 000)
            printf '%-4s %-20s %s\n' "$([ "$code" = 200 ] && echo OK || echo FAIL)" "$path" "$code"
            [ "$code" = 200 ] || fail=1
          done
          exit "$fail"
